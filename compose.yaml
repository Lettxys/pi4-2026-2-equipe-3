name: pi4-equipe-3

services:
  db:
    image: postgres:17-alpine
    container_name: pi4-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-isenta}
    ports:
      # Porta do host : porta fixa dentro do container
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persiste os dados entre `docker compose down`.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-isenta}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - pi4

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pi4-backend:dev
    container_name: pi4-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "3000"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-isenta}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-pi4-equipe-3}
      JWT__Audience: ${JWT_AUDIENCE:-pi4-equipe-3-clients}
      JWT__ExpiresInMinutes: ${JWT_EXPIRES_IN_MINUTES:-60}
      Cors__AllowedOrigins: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - pi4

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pi4-frontend:dev
    container_name: pi4-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - pi4

volumes:
  db_data:
  frontend_node_modules:

networks:
  pi4:
    driver: bridge
