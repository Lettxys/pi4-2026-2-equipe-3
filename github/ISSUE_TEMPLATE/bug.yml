name: Bug Report
description: Relate um erro ou comportamento inesperado para nos ajudar a identificar e corrigir o problema.
title: "[Bug]: "
labels: ["tipo:bug"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Obrigado por dedicar um tempo para relatar este problema!
        Preencha as informações abaixo com o máximo de detalhes possível.

  - type: input
    id: title
    attributes:
      label: Título do Bug
      description: Descreva o problema de forma curta, objetiva e indicando o módulo ou funcionalidade afetada.
      placeholder: "ex. Carrinho de compras - Botão de finalizar pagamento não responde"
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Resultado Esperado
      description: Descreva qual deveria ser o comportamento correto do sistema.
      placeholder: |
        Exemplo:
        O usuário deveria ser redirecionado para a tela de pagamento.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Passos para Reproduzir
      description: Informe passo a passo como reproduzir o problema.
      placeholder: |
        1. Acesse a página de produtos.
        2. Adicione o item X ao carrinho.
        3. Clique em "Finalizar Compra".
        4. Observe o erro.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      description: Qual o impacto do problema no sistema ou para o usuário?
      options:
        - Crítica
        - Alta
        - Média
        - Baixa
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Versão da Aplicação
      description: Informe a versão ou build em que o problema foi identificado.
      placeholder: "ex. v2.4.1 / Build 1542"
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Anexe capturas de tela, vídeos, logs do console ou outras evidências que ajudem na investigação.
      placeholder: |
        Arraste os arquivos para esta área ou cole os links das evidências.

        Exemplos:
        - Screenshot
        - Gravação de tela
        - Logs do console
        - Response da API
        - Stack trace
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Informações Adicionais
      description: Adicione qualquer informação que possa ajudar na investigação, como observações, workaround ou condições específicas.
      placeholder: |
        Observações:
        
        Workaround:
        
        Dados utilizados para reprodução:
    validations:
      required: false
