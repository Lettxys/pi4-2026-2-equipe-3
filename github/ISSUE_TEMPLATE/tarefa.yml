name: Task
description: Registre uma tarefa, implementação ou atividade necessária para o projeto.
title: "[Task]: "
labels: ["task", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        ## 📋 Task

        Obrigado por registrar esta tarefa!
        Preencha as informações abaixo para facilitar o entendimento,
        planejamento, execução e validação da atividade.
        
  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Explique o contexto da tarefa e por que ela é necessária.
      placeholder: |
        Descreva o cenário atual, problema ou necessidade que originou esta tarefa...
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Descreva de forma clara o que deve ser realizado.
      placeholder: |
        Exemplo:
        Criar um endpoint responsável por finalizar o pedido e persistir
        as informações da compra no banco de dados.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Escopo
      description: Informe o que deve fazer parte da tarefa e, se necessário, o que está fora do escopo.
      placeholder: |
        Incluir:
        - Criar endpoint POST /api/orders.
        - Validar os dados recebidos.
        - Persistir o pedido.

        Não incluir:
        - Alterações no frontend.
        - Implementação do pagamento.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Atividades
      description: Liste as atividades necessárias para concluir a tarefa. Exemplo: `- [ ] Criar rota da API`, `- [ ] Implementar validações`...
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Critérios de Aceite
      description: Defina as condições que devem ser atendidas para considerar a tarefa concluída. Exemplo: `- [ ] A API deve aceitar requisições POST /api/orders`.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Resultado Esperado
      description: Descreva o resultado final esperado após a conclusão da tarefa.
      placeholder: |
        Exemplo:
        Endpoint disponível, funcional, documentado e coberto por testes automatizados.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Prioridade
      description: Qual a prioridade para execução desta tarefa?
      options:
        - Crítica
        - Alta
        - Média
        - Baixa
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Pré-requisitos
      description: Informe dependências ou condições que precisam estar disponíveis antes do início da tarefa.
      placeholder: |
        - Banco de dados configurado.
        - Endpoint de autenticação disponível.
        - História US-123 concluída.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependências
      description: Liste outras Issues, tarefas, serviços ou equipes das quais esta tarefa depende.
      placeholder: |
        - #123
        - #145
        - Serviço de autenticação
    validations:
      required: false
      
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Após a execução, adicione screenshots, vídeos, logs, testes ou outras evidências que comprovem a conclusão da tarefa.
      placeholder: |
        Arraste os arquivos para esta área ou cole os links das evidências.

        Exemplos:
        - Screenshot
        - Gravação de tela
        - Logs
        - Resultado dos testes
        - Response da API
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Informações Adicionais
      description: Adicione qualquer informação relevante que não tenha sido contemplada nos campos anteriores.
      placeholder: |
        Observações:
        
        Informações complementares:
        
        Links de documentação:
    validations:
      required: false

  - type: input
    id: related-story
    attributes:
      label: História / Requisito relacionado
      description: Informe a User Story, requisito, Epic ou Issue relacionada.
      placeholder: "ex. US-123 / REQ-045 / #123"
    validations:
      required: false
